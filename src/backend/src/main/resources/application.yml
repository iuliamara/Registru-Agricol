server:
  port: 8080
  error:
    include-message: always

spring:
  config:
    import: optional:file:../../.env[.properties]
  application:
    name: multi-tenant-backend
  mail:
    host: ${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${SPRING_MAIL_PORT:2525}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jackson:
    serialization:
      fail-on-empty-beans: false
      write-dates-as-timestamps: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/multi_tenant_db}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        multiTenancy: SCHEMA
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: true

  flyway:
    enabled: true
    default-schema: public
    schemas: public
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours

app:
  documents:
    storage-path: ${APP_DOCUMENTS_STORAGE_PATH:/data/documents}
  signature:
    storage-path: ${APP_SIGNATURE_STORAGE_PATH:/data/signed-contracts}
  signnow:
    base-url: ${SIGNNOW_BASE_URL:https://api.signnow.com}
    basic-token: ${SIGNNOW_BASIC_TOKEN:}
    username: ${SIGNNOW_USERNAME:}
    password: ${SIGNNOW_PASSWORD:}
  crypto:
    aes-key: ${APP_CRYPTO_AES_KEY}
    salt: ${APP_CRYPTO_SALT}
  mail:
    from: ${APP_MAIL_FROM:test@test.ro}
